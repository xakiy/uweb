{% load navigation_tags wagtailcore_tags %}

<ul class="dropdown-menu" aria-labelledby="navbarDropdown{{ page.id }}">
  <!-- First link points to the parent landing page -->
    <li>
      <a class="dropdown-item" href="{{ parent.url }}">
        {{ parent.title }}
      </a>
    </li>
    <li><hr class="dropdown-divider"></li>
    {% for child in menuitems_children %}
      <li><a class="dropdown-item{% if child.url in request.get_full_path %} active{% endif %}" href="{% pageurl child %}">{% if child.seo_title %} {{ child.seo_title }} {% else %} {{ child.title }} {% endif %}</a></li>
    {% endfor %}
</ul>
